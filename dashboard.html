<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My LeetCode Solved</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #8b92a3; --accent: #ffa116;
    --easy: #2cc4a8; --med: #ffc01e; --hard: #ff4d6d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  #meta { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card .num { font-size: 30px; font-weight: 700; }
  .card .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .card.easy .num { color: var(--easy); } .card.med .num { color: var(--med); } .card.hard .num { color: var(--hard); }
  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--panel2); margin-bottom: 20px; }
  .bar i { display: block; height: 100%; }

  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .topic { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: 0; color: var(--text); padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 14px; text-align: left; }
  .topic:hover { background: var(--panel2); }
  .topic.active { background: var(--accent); color: #000; font-weight: 600; }
  .topic .c { color: var(--muted); font-size: 12px; }
  .topic.active .c { color: #000; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  #search { flex: 1; min-width: 200px; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 14px; outline: none; }
  #search:focus { border-color: var(--accent); }
  .chip { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; font-size: 13px; }
  .chip.active { color: #000; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .start { background: var(--text); color: #000; border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 600; cursor: pointer; }

  .listhead { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; }
  .listhead h2 { margin: 0; font-size: 18px; }
  .listhead span { color: var(--muted); font-size: 13px; }

  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--panel2); }
  .id { color: var(--muted); font-variant-numeric: tabular-nums; }
  .t { font-size: 14.5px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11px; color: var(--muted); background: var(--panel2); border-radius: 99px; padding: 2px 8px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
  .Easy { color: var(--easy); background: rgba(44,196,168,.12); }
  .Medium { color: var(--med); background: rgba(255,192,30,.12); }
  .Hard { color: var(--hard); background: rgba(255,77,109,.12); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; max-height: 220px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>My <span>LeetCode</span> Solved</h1>
    <div id="meta"></div>
  </header>

  <section class="stats" id="stats"></section>
  <div class="bar" id="bar"></div>

  <div class="layout">
    <aside id="topics"></aside>
    <section>
      <div class="toolbar">
        <input id="search" placeholder="Search title or number...">
        <button class="chip active" data-d="All">All</button>
        <button class="chip" data-d="Easy">Easy</button>
        <button class="chip" data-d="Medium">Medium</button>
        <button class="chip" data-d="Hard">Hard</button>
        <button class="start" id="start">Start ▶</button>
      </div>
      <div class="listhead"><h2 id="title"></h2><span id="count"></span></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
