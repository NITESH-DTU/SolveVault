<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5f2">
<title>SolveVault — Your solved library</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f2;
    --surface: #fff;
    --surface-soft: #f8f8f6;
    --ink: #18211d;
    --muted: #77817b;
    --line: #e7e9e4;
    --accent: #167a62;
    --accent-soft: #e7f3ee;
    --easy: #168565;
    --med: #b7791f;
    --hard: #c34f55;
    --shadow: 0 8px 30px rgba(27, 43, 35, .045);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid rgba(22, 122, 98, .3); outline-offset: 2px; }
  .wrap { width: min(1360px, 100%); margin: 0 auto; padding: 40px 48px 56px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
  .brand-mark { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 8px; background: var(--accent); color: white; font-size: 13px; letter-spacing: 0; }
  header h1 { margin: 14px 0 0; font-size: clamp(28px, 3.5vw, 40px); line-height: 1.08; letter-spacing: -.055em; font-weight: 680; }
  header h1 span { color: var(--accent); }
  #meta { margin-top: 9px; color: var(--muted); font-size: 13px; }
  .sync-note { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.65); color: var(--muted); font-size: 12px; white-space: nowrap; }
  .sync-dot { width: 7px; height: 7px; background: #56a783; border-radius: 50%; box-shadow: 0 0 0 3px #e6f2eb; }
  .stats { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 14px; margin: 26px 0 14px; }
  .card { min-height: 118px; padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .card:first-child { background: #1a3029; border-color: #1a3029; color: white; }
  .card .num { font-size: 35px; line-height: 1.1; font-weight: 680; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
  .card .lbl { margin-top: 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
  .card:first-child .lbl { color: #a9c5b8; }
  .card.easy .num { color: var(--easy); } .card.med .num { color: var(--med); } .card.hard .num { color: var(--hard); }
  .bar-wrap { display: flex; align-items: center; gap: 14px; margin: 0 2px 30px; }
  .bar { display: flex; flex: 1; height: 5px; border-radius: 99px; overflow: hidden; background: var(--line); }
  .bar i { display: block; height: 100%; }
  .bar-label { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .layout { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 24px; align-items: start; }
  aside { padding: 15px 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .side-label { padding: 2px 11px 11px; color: #9aa29c; font-size: 10px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
  .topic { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; color: #536059; padding: 9px 11px; border-radius: 9px; cursor: pointer; font-size: 13px; text-align: left; transition: background .16s ease, color .16s ease; }
  .topic:hover { background: var(--surface-soft); color: var(--ink); }
  .topic.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  .topic .c { color: #9aa29c; font-size: 11px; font-variant-numeric: tabular-nums; }
  .topic.active .c { color: var(--accent); }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .search-wrap { position: relative; flex: 1 1 230px; }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #919b94; font-size: 17px; pointer-events: none; }
  #search { width: 100%; min-width: 0; padding: 11px 14px 11px 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; outline: none; transition: border-color .16s ease, box-shadow .16s ease; }
  #search::placeholder { color: #9ba39d; }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22,122,98,.1); }
  .chip { padding: 9px 12px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; transition: all .16s ease; }
  .chip:hover { background: #ebeee9; color: var(--ink); }
  .chip.active { color: var(--accent); background: var(--accent-soft); border-color: #d7e9df; font-weight: 700; }
  .start { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; padding: 10px 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 650; font-size: 12px; cursor: pointer; box-shadow: 0 3px 8px rgba(22,122,98,.16); transition: background .16s ease, transform .16s ease; }
  .start:hover { background: #116851; transform: translateY(-1px); }
  .listhead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 0 2px 12px; }
  .listhead h2 { margin: 0; font-size: 17px; letter-spacing: -.025em; font-weight: 680; }
  .listhead span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); }
  .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 17px; color: var(--ink); text-decoration: none; border-bottom: 1px solid #eff0ed; transition: background .14s ease; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #fafbf9; }
  .id { color: #89938c; font-size: 12px; font-variant-numeric: tabular-nums; }
  .t { font-size: 13px; font-weight: 590; letter-spacing: -.01em; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 10px; color: #77817b; background: #f1f3f0; border-radius: 5px; padding: 2px 6px; }
  .badge { font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 6px; }
  .Easy { color: var(--easy); background: #e9f5ef; }
  .Medium { color: var(--med); background: #fbf2df; }
  .Hard { color: var(--hard); background: #faeaea; }
  .empty { text-align: center; color: var(--muted); padding: 58px 20px; font-size: 13px; }
  @media (max-width: 860px) {
    .wrap { padding: 28px 24px 40px; }
    .layout { grid-template-columns: 1fr; gap: 16px; }
    aside { position: static; max-height: 190px; }
    .side-label { position: sticky; top: -15px; z-index: 1; background: var(--surface); }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .wrap { padding: 22px 16px 32px; }
    header { align-items: flex-start; flex-direction: column; gap: 14px; padding-bottom: 21px; }
    .sync-note { font-size: 11px; }
    .stats { gap: 9px; margin-top: 18px; }
    .card { min-height: 98px; padding: 15px; border-radius: 13px; }
    .card .num { font-size: 29px; }
    .bar-wrap { margin-bottom: 22px; }
    .toolbar { gap: 4px; }
    .search-wrap { flex-basis: 100%; margin-bottom: 4px; }
    .chip { padding: 8px 9px; }
    .start { margin-left: auto; }
    .row { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 9px; padding: 12px; }
    .t { font-size: 12px; }
    .tag { font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow"><span class="brand-mark" aria-hidden="true">S</span> SolveVault <span aria-hidden="true">/</span> LEARNING LIBRARY</div>
      <h1>Your solved <span>library.</span></h1>
      <div id="meta" aria-live="polite"></div>
    </div>
    <div class="sync-note"><span class="sync-dot" aria-hidden="true"></span>Private to your browser</div>
  </header>

  <section class="stats" id="stats" aria-label="Solved problem statistics"></section>
  <div class="bar-wrap" aria-label="Solved problems by difficulty"><div class="bar" id="bar"></div><span class="bar-label">Difficulty breakdown</span></div>

  <main class="layout">
    <aside id="topics" aria-label="Filter by topic"><div class="side-label">Browse topics</div></aside>
    <section aria-label="Solved problems">
      <div class="toolbar" role="group" aria-label="Search and filter problems">
        <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Search solved problems" placeholder="Search by title or number…" autocomplete="off"></label>
        <button class="chip active" type="button" data-d="All" aria-pressed="true">All</button>
        <button class="chip" type="button" data-d="Easy" aria-pressed="false">Easy</button>
        <button class="chip" type="button" data-d="Medium" aria-pressed="false">Medium</button>
        <button class="chip" type="button" data-d="Hard" aria-pressed="false">Hard</button>
        <button class="start" id="start" type="button"><span aria-hidden="true">▶</span> Start practice</button>
      </div>
      <div class="listhead"><h2 id="title">All solved</h2><span id="count" aria-live="polite"></span></div>
      <div class="list" id="list" aria-live="polite"></div>
    </section>
  </main>
</div>
<script src="dashboard.js"></script>
</body>
</html>
